<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <title>Meu Cronograma Capilar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Topo da Aplicação -->
  <header class="app-header">
    <div class="header-content">
      <span class="badge" id="header-badge">Rotina Ativa</span>
      <h1 id="header-title">Cronograma Capilar</h1>
      <p id="header-desc">Hidratação, Nutrição e Reconstrução</p>
    </div>
  </header>

  <!-- Conteúdo Principal com Rolagem -->
  <main class="content-scroll" id="main-content">
    
    <!-- ABA 1: FEED / CRONOGRAMA DIÁRIO (COM SKELETON SCREENS) -->
    <section id="view-feed" class="view active">
      <div class="section-title">Próxima Etapa do Ciclo</div>
      <div id="cards-container">
        <!-- Skeleton Loading inicial pulsante -->
        <div class="skeleton-card">
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton-body">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-text"></div>
            <div class="skeleton skeleton-text short"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ABA 2: PRODUTOS RECOMENDADOS -->
    <section id="view-products" class="view">
      <div class="section-title">Produtos Recomendados</div>
      <div class="filter-chips">
        <button class="chip active" data-filter="all">Todos</button>
        <button class="chip" data-filter="Hidratação">Hidratação</button>
        <button class="chip" data-filter="Nutrição">Nutrição</button>
        <button class="chip" data-filter="Reconstrução">Reconstrução</button>
      </div>
      <div id="products-container">
        <!-- Inserido dinamicamente via JS com Skeleton simulado -->
      </div>
    </section>

    <!-- ABA 3: PERFIL / HISTÓRICO -->
    <section id="view-profile" class="view">
      <div class="card">
        <h3>Progresso Geral</h3>
        <p>Você completou 65% da sua meta mensal de cuidados capilares.</p>
        <div class="progress-bar" style="margin-top: 12px;">
          <div class="progress-fill" style="width: 65%;"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Inferior (Bottom Sheet) para Adicionar Produto/Dica -->
  <div class="bottom-sheet-overlay" id="post-modal">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <h3>Adicionar Novo Produto</h3>
      <input type="text" id="input-name" placeholder="Nome do Produto / Máscara" class="form-input" />
      <select id="input-category" class="form-input">
        <option value="Hidratação">Hidratação</option>
        <option value="Nutrição">Nutrição</option>
        <option value="Reconstrução">Reconstrução</option>
      </select>
      <input type="text" id="input-desc" placeholder="Descrição / Ativos principais" class="form-input" />
      <input type="text" id="input-img" placeholder="URL da Imagem (opcional)" class="form-input" />
      <div class="sheet-actions">
        <button class="btn-secondary" id="btn-cancel-post">Cancelar</button>
        <button class="btn-primary" id="btn-save-post">Salvar Produto</button>
      </div>
    </div>
  </div>

  <!-- Zona do Polegar: Barra de Navegação + FAB Centralizado -->
  <footer class="thumb-zone">
    <!-- Floating Action Button (Adicionar Postagem / Produto) -->
    <button class="fab-btn" id="btn-open-post" aria-label="Adicionar Produto">
      <span class="fab-icon">+</span>
    </button>

    <!-- Barra de Navegação Inferior -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-target="view-feed">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Rotina</span>
      </button>
      
      <button class="nav-item" data-target="view-products">
        <span class="nav-icon">🧴</span>
        <span class="nav-label">Produtos</span>
      </button>

      <div class="nav-spacer"></div> <!-- Espaço para o FAB não cobrir os botões -->

      <button class="nav-item" data-target="view-profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Perfil</span>
      </button>

      <button class="nav-item" id="btn-refresh">
        <span class="nav-icon">🔄</span>
        <span class="nav-label">Atualizar</span>
      </button>
    </nav>
  </footer>

  <script src="app.js"></script>
</body>
</html>
